services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ps-tech-lab:latest
    container_name: ps-tech-lab
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
