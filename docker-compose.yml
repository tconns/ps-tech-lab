services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ps-tech-lab:latest
    restart: unless-stopped
    # Không bind host port — Dokploy/Traefik route qua domain vào cổng 80 trong mạng compose
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
